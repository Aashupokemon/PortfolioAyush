<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="CPBFI certificate of completion awarded to Ayush Gupta">
  <rect width="1600" height="1000" fill="#d9e6dc"/>
  <rect x="478" y="118" width="660" height="770" rx="6" fill="#2b2925" fill-opacity="0.07"/>
  <rect x="470" y="110" width="660" height="770" rx="6" fill="#fdfcf7" stroke="#2b2925" stroke-opacity="0.14"/>
  <rect x="490" y="130" width="620" height="730" fill="none" stroke="#2b2925" stroke-opacity="0.18"/>
  <rect x="502" y="142" width="596" height="706" fill="none" stroke="#2b2925" stroke-opacity="0.09"/>

  <text x="800" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#2b2925" fill-opacity="0.45">BAJAJ FINSERV · CPBFI</text>

  <text x="800" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#2b2925" fill-opacity="0.85">Certificate</text>
  <text x="800" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#2b2925" fill-opacity="0.5">OF COMPLETION</text>
  <line x1="700" y1="352" x2="900" y2="352" stroke="#2b2925" stroke-opacity="0.2"/>

  <text x="800" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#2b2925" fill-opacity="0.45">This certifies that</text>

  <text x="800" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2925" fill-opacity="0.88">Ayush Gupta</text>
  <line x1="620" y1="488" x2="980" y2="488" stroke="#2b2925" stroke-opacity="0.18"/>

  <text x="800" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2b2925" fill-opacity="0.55">has completed one hundred days of Banking, Finance and</text>
  <text x="800" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2b2925" fill-opacity="0.55">Insurance training, with an HR workshop and assessment.</text>

  <g transform="rotate(-6 800 660)">
    <circle cx="800" cy="660" r="62" fill="none" stroke="#2f3bff" stroke-opacity="0.75" stroke-width="4"/>
    <circle cx="800" cy="660" r="50" fill="none" stroke="#2f3bff" stroke-opacity="0.45" stroke-width="2"/>
    <text x="800" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#2f3bff" fill-opacity="0.85">CPBFI</text>
    <text x="800" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#2f3bff" fill-opacity="0.65">2023</text>
  </g>

  <line x1="560" y1="770" x2="700" y2="770" stroke="#2b2925" stroke-opacity="0.25"/>
  <text x="560" y="790" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.4" fill="#2b2925" fill-opacity="0.4">PROGRAMME LEAD</text>
  <line x1="900" y1="770" x2="1040" y2="770" stroke="#2b2925" stroke-opacity="0.25"/>
  <text x="900" y="790" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.4" fill="#2b2925" fill-opacity="0.4">HUMAN RESOURCES</text>
